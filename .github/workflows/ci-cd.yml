name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ---------- Stages 1-2: Checkout, setup, install & lint ----------
  lint:
    name: "Stage 1-2: Setup, Install & Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ---------- Stage 3: Automated testing ----------
  test:
    name: "Stage 3: Unit & Integration Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run Jest with coverage (fails pipeline on test failure)
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  # ---------- Stage 4: Build & push container ----------
  build-push:
    name: "Stage 4: Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Stage 5a: Deploy via Render deploy hook (default) ----------
  deploy-render:
    name: "Stage 5: Deploy (Render webhook)"
    runs-on: ubuntu-latest
    needs: build-push
    if: vars.DEPLOY_TARGET != 'ec2'
    environment: production
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set" >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Smoke test (optional)
        if: vars.APP_URL != ''
        run: |
          for i in $(seq 1 15); do
            if curl --fail --silent "${{ vars.APP_URL }}/health"; then exit 0; fi
            echo "Waiting for app... ($i/15)"; sleep 10
          done
          exit 1

  # ---------- Stage 5b: Deploy via SSH to AWS EC2 (set repo variable DEPLOY_TARGET=ec2) ----------
  deploy-ec2:
    name: "Stage 5: Deploy (SSH to EC2)"
    runs-on: ubuntu-latest
    needs: build-push
    if: vars.DEPLOY_TARGET == 'ec2'
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ needs.build-push.outputs.image }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE:latest"
            docker stop cloud-cicd-app 2>/dev/null || true
            docker rm cloud-cicd-app 2>/dev/null || true
            docker run -d --name cloud-cicd-app --restart unless-stopped \
              -p 80:3000 -v app-data:/data -e APP_ENV=production \
              "$IMAGE:latest"
            docker image prune -f
